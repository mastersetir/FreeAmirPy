{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">برگشت از فروش — انتخاب فاکتور</h1>
<div class="card p-6 max-w-2xl">
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm mb-1">فاکتور فروش ثبت‌شده</label>
            {{ form.invoice }}
        </div>
        <p class="text-xs text-gray-500">
            پس از انتخاب، همه‌ی سطرهای قابل برگشت با مقدار کامل بارگذاری می‌شوند؛
            می‌توانید مقدار هر سطر را قبل از ثبت کاهش دهید.
        </p>
        <div class="flex gap-2">
            <button type="submit" class="btn btn-primary">ساخت برگشت</button>
            <a href="{% url 'sales:returns' %}" class="btn btn-outline">انصراف</a>
        </div>
    </form>
</div>
{% endblock %}
