{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">{{ title }}</h1>
<div class="card p-6 max-w-4xl">
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            {% for field in form %}
                <div>
                    <label class="block text-sm mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="text-red-600 text-xs mt-1">{{ field.errors.0 }}</div>{% endif %}
                </div>
            {% endfor %}
        </div>
        <div class="flex gap-2">
            <button type="submit" class="btn btn-primary">ذخیره</button>
            <a href="{% url 'hr:employees' %}" class="btn btn-outline">انصراف</a>
        </div>
    </form>
</div>
{% endblock %}
