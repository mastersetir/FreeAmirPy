{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">{{ title }}</h1>
<div class="card p-6 max-w-2xl">
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label class="block text-sm mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="text-red-600 text-xs mt-1">{{ field.errors.0 }}</div>{% endif %}
            </div>
        {% endfor %}
        <div class="flex gap-2">
            <button type="submit" class="btn btn-primary">ذخیره</button>
            <a href="{% url 'accounting:accounts' %}" class="btn btn-outline">انصراف</a>
        </div>
    </form>
</div>
{% endblock %}
